group 'com.flutter.logs.plogs.flutter_logs'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.flutter.logs.plogs.flutter_logs'
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 16
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    //RxJav2
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation  'io.reactivex.rxjava2:rxkotlin:2.2.0'

    // PLog (RxLogs v1.0.27 + null-config guards) is bundled as source under
    // src/main/java/com/blackbox/plog, see android/RXLOGS_VENDORED.md. These are
    // the dependencies the RxLogs artifact declared, so the app's classpath is unchanged.
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.work:work-rxjava2:2.7.1'
    // Not used by PLog itself; RxLogs declared it, so it stays to keep the classpath identical.
    implementation 'org.jetbrains.kotlin:kotlin-test:1.7.10'

    implementation "androidx.core:core-ktx:1.9.0"
    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    // Unit tests for the bundled PLog (Robolectric provides the Android environment)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.5.0'
}
